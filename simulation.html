<div class="sim-root" id="sim-root">
  <header class="sim-header">
    <h1>Physics – Force & Laws of Motion</h1>
    <div class="hook-banner">
      “An object's acceleration is determined by the net force acting on it and its mass.”
    </div>
  </header>
  <main class="sim-main">
    <section class="left-pane">
      <nav class="scene-selector" aria-label="Scene selection">
        <button class="scene-btn active" data-scene="1"><span class="icon">law_2</span> <span class="label">Newton's 2nd Law</span></button>
        <button class="scene-btn" data-scene="2"><span class="icon">law_1</span> <span class="label">Balanced Forces</span></button>
        <button class="scene-btn" data-scene="3"><span class="icon">friction</span> <span class="label">Friction/FBDs</span></button>
        <button class="scene-btn" data-scene="4"><span class="icon">incline</span> <span class="label">Inclined Plane</span></button>
        <button class="scene-btn" data-scene="5"><span class="icon">energy</span> <span class="label">Work & Energy</span></button>
      </nav>
      <div class="canvas-wrapper">
        <div id="sim-canvas" class="canvas">
          <div id="haze-layer"></div>
          <div id="wind-layer"></div>
          <div id="scene-stage"></div>
          <div id="particle-layer"></div>
          <div class="thermometer-widget">
            <div class="therm-glass">
              <div class="therm-marks"><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span></div>
              <div class="therm-liquid" id="therm-liquid"></div>
            </div>
            <div class="therm-readout"><span id="therm-val">0</span> N</div>
          </div>
          <div class="molecule-scope" style="display:none">
            <div class="scope-label">Micro View</div>
            <div class="scope-lens" id="scope-lens"></div>
          </div>
          <div id="chill-badge" class="chill-badge" hidden>MAX FORCE</div>
          <div class="canvas-legend">
            <div class="legend-item"><span class="arrow-legend applied"></span> Applied Force</div>
            <div class="legend-item"><span class="arrow-legend friction"></span> Frictional Force</div>
            <div class="legend-item"><span class="arrow-legend net"></span> Net Force</div>
          </div>
        </div>
      </div>
      <section class="control-panel">
        <div class="control-grid">
          <div class="control-group">
            <label class="lbl-temp">Net Force (<span id="val-temp">50</span> N)</label>
            <input type="range" id="inp-temp" min="0" max="100" value="50" class="slider-temp">
          </div>
          <div class="control-group">
            <label class="lbl-hum">Friction Coeff. (<span id="val-hum">0.2</span>)</label>
            <input type="range" id="inp-humidity" min="0" max="0.8" step="0.1" value="0.2" class="slider-hum">
          </div>
          <div class="control-group">
            <label class="lbl-wind">Force Angle (<span id="val-wind">0</span>°)</label>
            <input type="range" id="inp-wind" min="-30" max="30" value="0" class="slider-wind">
          </div>
          <div class="control-group">
            <label class="lbl-area">Mass (<span id="val-area">20</span> kg)</label>
            <input type="range" id="inp-area" min="5" max="50" step="5" value="20" class="slider-area">
          </div>
          <div class="control-group full-width">
            <label class="lbl-liquid">Motion Type</label>
            <select id="inp-liquid">
              <option value="linear" selected>Linear Motion</option>
              <option value="friction">Friction Motion</option>
              <option value="incline">Inclined Plane</option>
              <option value="circular">Circular Motion</option>
            </select>
          </div>
        </div>
        <div class="action-bar">
          <div class="btn-group">
            <button id="btn-run" class="primary-btn">Run</button>
            <button id="btn-pause" disabled>Pause</button>
            <button id="btn-reset">Reset</button>
          </div>
          <div class="readouts">
            <div class="readout-box">
              <span class="label">Acceleration (m/s²)</span>
              <span id="out-evap" class="value pulse-target">0.00</span>
            </div>
            <div class="readout-box">
              <span class="label">Net Force & Work-Energy</span>
              <span id="out-cool" class="value pulse-target">0.00</span>
            </div>
          </div>
        </div>
      </section>
    </section>
    <aside class="right-pane">
      <div class="tabs-section">
        <div class="tabs">
          <button class="tab-btn active" data-tab="visual">Visual</button>
          <button class="tab-btn" data-tab="analogy">Analogy</button>
          <button class="tab-btn" data-tab="cause">Cause</button>
          <button class="tab-btn" data-tab="model">Model</button>
          <button class="tab-btn" data-tab="fix">Fix</button>
        </div>
        <div id="tab-content" class="tab-content"></div>
      </div>
      <div class="lab-guide">
        <div class="guide-header">
          <span class="guide-icon">🧪</span>
          <h4>Lab Challenges</h4>
        </div>
        <div id="guide-content" class="guide-content">
          </div>
      </div>
    </aside>
  </main>
</div>
